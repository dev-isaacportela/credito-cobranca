<style>
/* Jurídico (prefixo jur-): só tokens. */
.jur-h { font-size: 18px; font-weight: 700; }
.jur-sem-margem, .jur-bloco .kpis { margin-top: 0; }
.jur-sem-margem .linha, .jur-bloco .linha { flex-wrap: wrap; align-items: center; }
.jur-sem-margem .valor, .jur-bloco .valor { white-space: nowrap; }
.jur-bloco { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; align-items: start; }
.jur-bloco-t { font-family: var(--font-title); font-weight: 700; font-size: 14px; padding-top: 12px; display: grid; gap: 2px; }
.jur-bloco-t span { font-family: "Work Sans", sans-serif; font-weight: 400; font-size: 12px; color: var(--muted-foreground); }
@media (max-width: 900px) { .jur-bloco { grid-template-columns: 1fr; } }
.jur-recolhe > summary { cursor: pointer; list-style: none; }
.jur-recolhe > summary::-webkit-details-marker { display: none; }
.jur-recolhe > summary::after { content: "+"; margin-left: auto; font-weight: 700; color: var(--muted-foreground); }
.jur-recolhe[open] > summary::after { content: "\2212"; }
.jur-recolhe:not([open]) > summary.faixa { border-bottom: 0; }
.jur-curto { min-width: 130px; }
.jur-largo { width: 100%; }
.btn.jur-largo { justify-content: center; white-space: normal; height: auto; min-height: 36px; padding-block: 6px; line-height: 1.25; text-align: center; }
/* Painel de aba escondido: .corpo-painel tem display próprio e venceria o atributo hidden */
.com-abas [data-painel][hidden] { display: none; }
.jur-auto { justify-self: start; }
.jur-perigo { color: var(--destructive); }
.jur-cresce { flex: 1; min-width: 0; }
.jur-esq { justify-content: flex-start; }
.jur-dir { display: grid; justify-items: end; gap: 2px; text-align: right; }
.jur-borda { border: 1px solid var(--row-border); border-radius: .75rem; }
.jur-rot { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; font-weight: 600; color: var(--ink-muted); }
.jur-ativo { background: var(--accent); color: var(--primary); border-color: var(--primary); }
.jur-seg button[aria-selected="true"] { background: var(--card); color: var(--primary); box-shadow: 0 1px 2px color-mix(in srgb, var(--foreground) 12%, transparent); }
.jur-grupo td { background: var(--muted); font-weight: 600; }
/* Quadro da lib: barra e faixa na cor da fase, selo de etiqueta, progresso e os três tempos */
.jur-fase { border-top: 3px solid var(--cor, var(--data-1)); }
.jur-fase .cartao { border-left: 3px solid var(--cor, var(--data-1)); }
.jur-fase-sub { flex-shrink: 0; padding: 0 6px; font-size: 11.5px; color: var(--muted-foreground); }
